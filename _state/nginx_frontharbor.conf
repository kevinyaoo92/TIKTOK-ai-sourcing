# ========== Server 1: IP 访问（扩展用，HTTP + Basic Auth） ==========
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    auth_basic "Frontharbor";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location /api/poc_ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ========== Server 2: 域名 HTTP → 跳 HTTPS ==========
server {
    listen 80;
    listen [::]:80;
    server_name frontharbor.cn www.frontharbor.cn;
    return 301 https://$host$request_uri;
}

# ========== Server 3: 域名 HTTPS 正式入口 ==========
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name frontharbor.cn www.frontharbor.cn;

    ssl_certificate     /etc/nginx/ssl/frontharbor.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/frontharbor.cn.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    auth_basic "Frontharbor";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location /api/poc_ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}