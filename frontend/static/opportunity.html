<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>TikTok Shop 商品机会分析</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#1e3a8a',
              hover: '#1e40af',
              light: '#eff6ff',
              border: '#bfdbfe'
            }
          }
        }
      }
    };
  </script>
  <style>
    /* 基础兜底：即使 Tailwind CDN 未加载，正文仍可读 */
    body { font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f8fafc; }
    .view { padding: 24px 16px 48px; }
    @media (min-width: 1024px) { .view { padding: 32px 24px 64px; } }
    /* 打印：隐藏交互控件，仅保留内容 */
    @media print {
      .no-print, .no-print * { display: none !important; }
      body { background: #fff; }
      .view { padding: 0; }
      .card-print { break-inside: avoid; }
    }
    .bar-transition { transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .finder-progress-fill {
      background: linear-gradient(90deg, #1e3a8a 0%, #3b82f6 50%, #60a5fa 100%);
      position: relative;
      overflow: hidden;
      transition: width 0.4s ease-out;
    }
    .finder-progress-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
      animation: shimmer 1.6s infinite;
    }
    @keyframes spin-slow { to { transform: rotate(360deg); } }
    .finder-spinner { animation: spin-slow 1s linear infinite; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">

  <h1 class="sr-only">TikTok Shop 商品机会分析</h1>

  <!-- ======================= 顶部导航 ======================= -->
  <header class="sticky top-0 z-30 bg-brand text-white shadow-md no-print">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex flex-wrap items-center justify-between gap-x-6 gap-y-2 py-3">
        <!-- 左侧：系统名称 -->
        <div class="flex items-center gap-2 min-w-0">
          <span aria-hidden="true" class="text-lg">📦</span>
          <span class="font-semibold text-sm sm:text-base truncate">TikTok Shop 商品机会分析</span>
        </div>

        <!-- 中间：导航 -->
        <nav class="order-3 w-full sm:order-none sm:w-auto flex items-center gap-1 bg-white/10 rounded-lg p-1" aria-label="主导航">
          <button type="button" id="nav-back" class="nav-btn px-4 py-1.5 rounded-md text-sm font-medium text-white/80 hover:bg-white/10 hover:text-white" data-view="back">返回</button>
          <button type="button" id="nav-overview" class="nav-btn px-4 py-1.5 rounded-md text-sm font-medium text-white/80 hover:bg-white/10 hover:text-white" data-view="overview">总览</button>
          <button type="button" id="nav-list" class="nav-btn px-4 py-1.5 rounded-md text-sm font-medium text-white/80 hover:bg-white/10 hover:text-white" data-view="list">列表</button>
        </nav>

        <!-- 右侧：周期 + 类目 -->
        <div class="flex items-center gap-2">
          <label class="flex items-center gap-1.5 text-xs text-white/80">
            <span aria-hidden="true">📅</span>
            <span class="hidden sm:inline">数据周期</span>
            <select id="period-select" class="bg-white text-slate-700 text-xs rounded-md px-2 py-1.5 border border-white/30 focus:outline-none" aria-label="数据周期">
              <option>2026-08</option>
            </select>
          </label>
          <label class="flex items-center gap-1.5 text-xs text-white/80">
            <span aria-hidden="true">🗂️</span>
            <span class="hidden sm:inline">类目</span>
            <select id="category-select" class="bg-white text-slate-700 text-xs rounded-md px-2 py-1.5 border border-white/30 focus:outline-none" aria-label="类目筛选"></select>
          </label>
        </div>
      </div>
    </div>
      <div class="max-w-7xl mx-auto px-4 pb-2">
        <div id="quota-bar" class="text-xs text-white/70"></div>
      </div>
  </header>

  <main id="app" class="max-w-7xl mx-auto">

    <!-- ======================= 1. 机会总览 ======================= -->
    <section id="view-overview" class="view" aria-labelledby="overview-title">
      <div class="flex flex-wrap items-end justify-between gap-2 mb-6">
        <div>
          <h2 id="overview-title" class="text-xl sm:text-2xl font-bold text-slate-900">机会总览</h2>
          <p class="text-sm text-slate-500 mt-1">基于 2026-08 泰国站关键词数据，综合需求 / 转化 / 竞争三维评分</p>
        </div>
        <span class="text-xs text-slate-400">数据周期：2026-08</span>
      </div>

      <!-- 样本量警告 -->
      <div id="sample-warning" class="hidden mb-4 inline-flex items-center gap-2 rounded-lg bg-amber-50 border border-amber-200 px-4 py-2.5 text-sm text-amber-700">
        <span aria-hidden="true">⚠️</span>
        <span>该 L2 关键词样本较少（&lt; 30），评分结果仅供参考</span>
      </div>

      <!-- 统计卡片 -->
      <div id="stat-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-8"></div>

      <!-- Top 机会卡片网格 -->
      <h3 class="text-lg font-semibold text-slate-800 mb-4">Top 机会</h3>
      <div id="opportunity-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 sm:gap-5"></div>
    </section>

    <!-- ======================= 2. 机会列表 ======================= -->
    <section id="view-list" class="view hidden" aria-labelledby="list-title">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 id="list-title" class="text-xl sm:text-2xl font-bold text-slate-900">机会列表</h2>
        <div class="w-full sm:w-72">
          <input id="search-input" type="search" placeholder="搜索商品方向或关键词…"
                 class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand/40">
        </div>
      </div>
      <p id="list-count" class="text-sm text-slate-500 mb-3"></p>
      <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-[760px] w-full text-sm" aria-label="机会列表">
          <caption class="sr-only">机会列表，点击表头可按对应分数排序</caption>
          <thead>
            <tr class="bg-slate-50 text-left text-slate-500">
              <th scope="col" class="px-4 py-3 font-medium">商品方向</th>
              <th scope="col" class="px-4 py-3 font-medium">
                <button type="button" class="sort-btn inline-flex items-center gap-1 hover:text-brand" data-key="score">机会分<span class="sort-arrow" data-arrow="score"></span></button>
              </th>
              <th scope="col" class="px-4 py-3 font-medium">评级</th>
              <th scope="col" class="px-4 py-3 font-medium">
                <button type="button" class="sort-btn inline-flex items-center gap-1 hover:text-brand" data-key="demandScore">需求分<span class="sort-arrow" data-arrow="demandScore"></span></button>
              </th>
              <th scope="col" class="px-4 py-3 font-medium">
                <button type="button" class="sort-btn inline-flex items-center gap-1 hover:text-brand" data-key="conversionScore">转化分<span class="sort-arrow" data-arrow="conversionScore"></span></button>
              </th>
              <th scope="col" class="px-4 py-3 font-medium">
                <button type="button" class="sort-btn inline-flex items-center gap-1 hover:text-brand" data-key="competitionScore">竞争分<span class="sort-arrow" data-arrow="competitionScore"></span></button>
              </th>
              <th scope="col" class="px-4 py-3 font-medium">类目</th>
              <th scope="col" class="px-4 py-3 font-medium">代表关键词</th>
              <th scope="col" class="px-4 py-3 font-medium">操作</th>
            </tr>
          </thead>
          <tbody id="list-body"></tbody>
        </table>
      </div>
    </section>

    <!-- ======================= 3. 机会详情 ======================= -->
    <section id="view-detail" class="view hidden" aria-labelledby="detail-title"></section>

  </main>

  <!-- Toast -->
  <div id="toast" role="status" aria-live="polite"
       class="no-print fixed left-1/2 -translate-x-1/2 bottom-8 z-50 hidden rounded-lg bg-slate-800 text-white text-sm px-5 py-2.5 shadow-lg">
    感谢反馈
  </div>

  <script>
  (function () {
    "use strict";

    /* ==================================================================
       真实数据分析链路（POST /api/analyze）
       数据源：tiktok_market.db 真实采集 + Stage0-5 确定性评分 + DeepSeek 语义
       ================================================================== */

    var RATING_STYLE = {
      S: { badge: "bg-emerald-100 text-emerald-700", dot: "bg-emerald-500", label: "S 级" },
      A: { badge: "bg-blue-100 text-blue-700", dot: "bg-blue-500", label: "A 级" },
      B: { badge: "bg-amber-100 text-amber-700", dot: "bg-amber-400", label: "B 级" },
      C: { badge: "bg-gray-200 text-gray-600", dot: "bg-gray-400", label: "C 级" }
    };

    var el = {
      overview: document.getElementById("view-overview"),
      list: document.getElementById("view-list"),
      detail: document.getElementById("view-detail"),
      statGrid: document.getElementById("stat-grid"),
      oppGrid: document.getElementById("opportunity-grid"),
      listBody: document.getElementById("list-body"),
      listCount: document.getElementById("list-count"),
      searchInput: document.getElementById("search-input"),
      categorySelect: document.getElementById("category-select"),
      toast: document.getElementById("toast")
    };

    /* ---------------------------------------------------------- 状态 */
    var STATE = {
      opportunities: [],   // 真实机会（API 返回）
      selection: null,     // {country, level1, level2[], period, ...}
      activePeriod: null,  // 后端 active_period，页面加载时异步获取
      loading: false,
      error: null,
      cohortSize: 0,
      ratingFilter: null,  // 当前等级过滤：null / S / A / B / C
      summary: {}          // 后端返回的 summary
    };

    // 页面加载时拉取后端 active_period，返回 Promise 供初始化逻辑 await
    var periodReady = fetch("/api/active_period")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.period) return;
        STATE.activePeriod = d.period;
        var sel = document.getElementById("period-select");
        if (sel) sel.innerHTML = "<option>" + d.period + "</option>";
        var titleP = document.querySelector("#overview-title + p");
        if (titleP) {
          titleP.textContent = "基于 " + d.period + " 泰国站关键词数据，综合需求 / 转化 / 竞争三维评分";
        }
        var spans = document.querySelectorAll("span");
        for (var i = 0; i < spans.length; i++) {
          var t = spans[i].textContent || "";
          if (t.indexOf("数据周期：") === 0) {
            spans[i].textContent = "数据周期：" + d.period;
          }
        }
      })
      .catch(function () { /* ignore */ });

    /* ---------------------------------------------------------- 工具 */
    function $(id) { return document.getElementById(id); }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    var toastTimer = null;
    function showToast(msg) {
      el.toast.textContent = msg;
      el.toast.classList.remove("hidden");
      if (toastTimer) window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(function () { el.toast.classList.add("hidden"); }, 2200);
    }

    function ratingInfo(r) { return RATING_STYLE[r] || RATING_STYLE.C; }

    /* 把 API 机会对象映射为前端渲染字段（保持视觉结构一致） */
    function normOpp(o, idx) {
      return {
        id: o.opportunity_id || ("opp-" + idx),
        name: o.name_cn || o.representative_keyword,
        score: o.score,
        rating: o.rating,
        action: o.action,
        category: (o.level1 || STATE.selection && STATE.selection.level1 || "") + " > " + (o.level2 || STATE.selection && STATE.selection.level2 || ""),
        period: o.period || (STATE.selection && STATE.selection.period) || STATE.activePeriod || "2026-08",
        demandScore: o.demand_score,
        conversionScore: o.conversion_score,
        competitionScore: o.competition_score,
        keyword: o.representative_keyword,
        keywordCn: o.representative_keyword_cn || o.name_cn || "",
        searchTerms1688: o.search_terms_1688 || [],
        evidence: o.evidence || [],
        aiSummary: o.ai_summary || "",
        marketJudgment: o.market_judgment || "—",
        competitionJudgment: o.competition_judgment || "—",
        suitable: o.suitable_for_tiktok_th || "—",
        searchTerms1688: o.search_terms_1688 || [],
        risks: o.risks || [],
        confidence: o.confidence || 0,
        sampleSize: STATE.cohortSize || o.summary_cohort_size || 0
      };
    }

    function fmt1(v) {
      if (v === null || v === undefined || v === "") return "—";
      var n = Number(v);
      return isNaN(n) ? String(v) : n.toFixed(1);
    }

    function miniBar(label, value, color, maxVal) {
      var v = Number(value);
      if (isNaN(v)) v = 0;
      var mx = Number(maxVal);
      if (isNaN(mx) || mx <= 0) mx = 1;
      var ratio = v / mx;
      if (ratio < 0) ratio = 0;
      if (ratio > 1) ratio = 1;
      var w = ratio * 100;
      var inner = (v > 0)
        ? '<div class="bar-transition h-full rounded-full ' + color + '" style="width:' + w.toFixed(1) + '%"></div>'
        : '';
      var numCls;
      if (v >= 0.9) numCls = "text-emerald-700";
      else if (v >= 0.7) numCls = "text-blue-700";
      else numCls = "text-amber-700";
      return '<div class="flex items-center gap-3">' +
        '<span class="w-12 shrink-0 text-xs text-slate-500">' + label + '</span>' +
        '<div class="flex-1 h-3 rounded-full bg-slate-100 border border-slate-200 overflow-hidden">' +
          inner +
        '</div>' +
        '<span class="w-11 shrink-0 text-right text-base font-bold tabular-nums ' + numCls + '">' + fmt1(value) + '</span>' +
      '</div>';
    }

    /* ---------------------------------------------------------- 视图切换 */
    var CURRENT_VIEW = null;
    var _historyReady = false;
    function showView(name, opts) {
      var prev = CURRENT_VIEW;
      CURRENT_VIEW = name;
      el.overview.classList.toggle("hidden", name !== "overview");
      el.list.classList.toggle("hidden", name !== "list");
      el.detail.classList.toggle("hidden", name !== "detail");
      document.querySelectorAll(".nav-btn").forEach(function (b) {
        var active = b.getAttribute("data-view") === name;
        b.classList.toggle("bg-white/20", active);
        b.classList.toggle("text-white", active);
        b.classList.toggle("text-white/80", !active);
      });
      window.scrollTo({ top: 0, behavior: "smooth" });
      if (!(opts && opts.fromPop) && prev !== name) {
        try {
          var url = (name === "overview")
            ? window.location.pathname + window.location.search
            : "#" + name;
          if (!_historyReady) {
            _historyReady = true;
            history.replaceState({ view: name }, "", url);
          } else {
            history.pushState({ view: name }, "", url);
          }
        } catch (e) {}
      }
      _historyReady = true;
    }

    function goBack() {
      if (!CURRENT_VIEW || CURRENT_VIEW === "overview") {
        location.href = "/";
        return;
      }
      if (window.history.length > 1) {
        history.back();
      } else {
        showView("overview");
      }
    }

    /* ---------------------------------------------------------- 总览页 */
    function renderStats(list) {
      var counts = { S: 0, A: 0, B: 0, C: 0 };
      list.forEach(function (o) { counts[o.rating] = (counts[o.rating] || 0) + 1; });
      var cards = [
        { key: "S", title: "S 级数量", desc: "优先上架", extra: "bg-emerald-50 text-emerald-700" },
        { key: "A", title: "A 级数量", desc: "建议上架", extra: "bg-blue-50 text-blue-700" },
        { key: "B", title: "B 级数量", desc: "可上架", extra: "bg-amber-50 text-amber-700" },
        { key: "C", title: "C 级数量", desc: "观察", extra: "bg-gray-100 text-gray-600" }
      ];
      el.statGrid.innerHTML = cards.map(function (c) {
        var n = counts[c.key] || 0;
        var active = STATE.ratingFilter === c.key;
        var btnCls = active
          ? "bg-brand text-white border border-brand"
          : "bg-white text-slate-600 border border-slate-300 hover:border-brand hover:text-brand";
        return '<div class="rounded-xl border border-slate-200 bg-white p-4 sm:p-5 shadow-sm">' +
          '<div class="flex items-center gap-2">' +
            '<span class="h-2.5 w-2.5 rounded-full ' + ratingInfo(c.key).dot + '" aria-hidden="true"></span>' +
            '<span class="text-sm text-slate-500">' + c.title + '</span>' +
          '</div>' +
          '<div class="mt-2 flex items-center justify-between">' +
            '<span class="text-3xl font-bold ' + c.extra + '">' + n + '</span>' +
            '<button type="button" class="rating-filter-btn rounded-md px-2.5 py-1 text-xs font-medium transition-colors ' + btnCls + '" data-rating="' + c.key + '">' + (active ? "取消" : "查看") + '</button>' +
          '</div>' +
          '<div class="mt-1 text-xs text-slate-400">' + c.desc + '</div>' +
        '</div>';
      }).join("");
    }

    function renderOverview() {
      // 样本量警告
      var warn = document.getElementById("sample-warning");
      if (warn) {
        var sz = STATE.summary && STATE.summary.sample_size;
        if (sz === "small") {
          warn.classList.remove("hidden");
        } else {
          warn.classList.add("hidden");
        }
      }
      var filter = STATE.ratingFilter;
      var visible;
      if (filter) {
        visible = STATE.opportunities.filter(function (o) { return o.rating === filter; });
      } else {
        visible = STATE.opportunities.filter(function (o) { return o.rating !== "C"; });
      }
      var sorted = visible.slice().sort(function (a, b) { return b.score - a.score; });
      renderStats(STATE.opportunities);
      if (sorted.length === 0) {
        el.oppGrid.innerHTML = '<div class="col-span-full text-center py-16 text-slate-400">该等级暂无机会</div>';
        return;
      }
      el.oppGrid.innerHTML = sorted.map(function (o) {
        var r = ratingInfo(o.rating);
        return '<article class="card-print rounded-xl border border-slate-200 bg-white p-5 shadow-sm flex flex-col gap-4">' +
          '<div class="flex items-start justify-between gap-3">' +
            '<h4 class="text-base font-semibold text-slate-900 leading-snug">' + esc(o.name) + '</h4>' +
            '<span class="shrink-0 rounded-md px-2 py-0.5 text-xs font-medium ' + r.badge + '">' + r.label + '</span>' +
          '</div>' +
          '<div class="flex items-baseline gap-2">' +
            '<span class="text-4xl font-bold text-brand tabular-nums">' + fmt1(o.score) + '</span>' +
            '<span class="text-xs text-slate-400">机会分</span>' +
          '</div>' +
          '<div class="space-y-2">' +
            (function(){
              var _m = Math.max(o.demandScore||0, o.conversionScore||0, o.competitionScore||0);
              if (_m <= 0) _m = 1;
              return miniBar("需求", o.demandScore, "bg-blue-600", _m) +
                     miniBar("转化", o.conversionScore, "bg-emerald-500", _m) +
                     miniBar("竞争", o.competitionScore, "bg-amber-500", _m);
            })() +
          '</div>' +
          '<div class="rounded-lg bg-slate-50 px-3 py-2 text-xs">' +
            '<div class="text-slate-500">代表关键词</div>' +
            '<div class="mt-0.5 font-medium text-slate-800">' + esc(o.keyword) + '</div>' +
            '<div class="text-slate-400">' + esc(o.keywordCn) + '</div>' +
          '</div>' +
          '<div class="mt-auto flex gap-2">' +
            '<button type="button" class="flex-1 rounded-lg border border-brand px-3 py-2 text-sm font-medium text-brand hover:bg-brand hover:text-white transition-colors" data-detail="' + esc(o.id) + '">查看详情</button>' +
            '<button type="button" class="flex-1 rounded-lg bg-brand px-3 py-2 text-sm font-medium text-white hover:bg-brand-hover transition-colors" data-find-suppliers="' + esc(o.id) + '">找优质货源</button>' +
          '</div>' +
        '</article>';
      }).join("");
    }

    /* ---------------------------------------------------------- 列表页 */
    var sortState = { key: "score", dir: "desc" };

    function currentList() {
      var q = el.searchInput.value.trim().toLowerCase();
      var list = STATE.opportunities.filter(function (o) {
        if (!q) return true;
        var hay = [o.name, o.keyword, o.keywordCn, o.category]
          .join(" ").toLowerCase();
        return hay.indexOf(q) !== -1;
      });
      list.sort(function (a, b) {
        var va = a[sortState.key];
        var vb = b[sortState.key];
        if (va < vb) return sortState.dir === "asc" ? -1 : 1;
        if (va > vb) return sortState.dir === "asc" ? 1 : -1;
        return 0;
      });
      return list;
    }

    function renderList() {
      var list = currentList();
      el.listCount.textContent = "共 " + list.length + " 个机会";
      if (list.length === 0) {
        el.listBody.innerHTML = '<tr><td colspan="9" class="px-4 py-10 text-center text-slate-400">未找到匹配的机会</td></tr>';
        return;
      }
      el.listBody.innerHTML = list.map(function (o) {
        var r = ratingInfo(o.rating);
        return '<tr class="border-t border-slate-100 hover:bg-slate-50">' +
          '<td class="px-4 py-3 font-medium text-slate-900">' + esc(o.name) + '</td>' +
          '<td class="px-4 py-3"><span class="text-base font-bold text-brand tabular-nums">' + fmt1(o.score) + '</span></td>' +
          '<td class="px-4 py-3"><span class="rounded-md px-2 py-0.5 text-xs font-medium ' + r.badge + '">' + r.label + '</span></td>' +
          '<td class="px-4 py-3 text-slate-700 tabular-nums">' + fmt1(o.demandScore) + '</td>' +

    function getUUID() {
      var KEY = "frontharbor_uuid";
      var v = localStorage.getItem(KEY);
      if (v) return v;
      var m = document.cookie.match(/(^|; )frontharbor_uuid=([^;]+)/);
      if (m) {
        v = decodeURIComponent(m[2]);
        localStorage.setItem(KEY, v);
        return v;
      }
      if (window.crypto && crypto.randomUUID) {
        v = crypto.randomUUID();
      } else {
        v = "u-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
      }
      localStorage.setItem(KEY, v);
      document.cookie = "frontharbor_uuid=" + encodeURIComponent(v) + "; max-age=" + (365*24*3600) + "; path=/";
      return v;
    }

            stopFindSourcePoll();
            var stuckTaskId = FIND_SRC.taskId;
            FIND_SRC.taskId = null;
            if (stuckTaskId) {
              fetch("/api/poc_task/cancel", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ task_id: stuckTaskId })
              }).catch(function () {});
            }
            renderFindError("未检测到浏览器助手响应。请确认已安装 Frontharbor 浏览器助手，并保持 1688 已登录。");
            return;
          }
          if (t.task_status === "running") {
            renderFindProgress("扩展正在 1688 上执行找货，请稍候...");
            return;
          }
          if (t.task_status === "success") {
            stopFindSourcePoll();
            FIND_SRC.taskId = null;
            var payload = t.payload || {};
            renderFindResults(payload.results || [], payload.tier_used || null);
            return;
          }
          if (t.task_status === "failed") {
            stopFindSourcePoll();
            FIND_SRC.taskId = null;
            var p2 = t.payload || {};
            var reason = t.error || "任务执行失败";
            if (p2.error === "no_cards_after_filter") reason = "搜索结果被过滤后无候选商品";
            else if (p2.error === "no_cards") reason = "1688 未返回搜索结果";
            else if (p2.error === "build_search_url_failed") reason = "搜索词编码失败";
            renderFindError(reason);
            return;
          }
          if (t.task_status === "cancelled") {
            stopFindSourcePoll();
            FIND_SRC.taskId = null;
            return;
          }
        })
        .catch(function () { /* 静默重试 */ });
    }

    function startFindSource(oppId) {

      var opp = null;
      for (var i = 0; i < STATE.opportunities.length; i++) {
        if (STATE.opportunities[i].id === oppId) { opp = STATE.opportunities[i]; break; }
      }
      if (!opp) { showToast("未找到该机会"); return; }
      var kw = pickSearchTerm(opp);
      if (!kw) { showToast("该机会没有可用的搜索词"); return; }
      FIND_SRC.oppId = oppId;
      FIND_SRC.taskId = null;
      FIND_SRC.startedAt = Date.now();
      stopFindSourcePoll();
      renderFindProgress("正在创建找货任务...");
      fetch("/api/poc_task/create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task_type: "find_full", keyword: kw })
      }).then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d || d.status !== "ok") { renderFindError("创建任务失败"); return; }
          FIND_SRC.taskId = d.task_id;
          try { localStorage.setItem("frontharbor_find_task", JSON.stringify({taskId: d.task_id, startedAt: FIND_SRC.startedAt, oppId: FIND_SRC.oppId})); } catch (e) {}
          renderFindProgress("已下发任务，等待浏览器助手拾取...");
          FIND_SRC.timer = setInterval(pollFindSource, 2000);

      // 用卡片显示的商品名全称作为搜索词（不截断，覆盖全部商品方向）
      var terms = opp.searchTerms1688;
      if (typeof terms === "string") { try { terms = JSON.parse(terms); } catch(e) { terms = []; } }
      if (!Array.isArray(terms)) terms = [];
      var kw = (opp.name || "").trim();
      if (!kw) { kw = terms.length > 0 ? String(terms[0]).trim() : (opp.keywordCn || "").trim(); }

      // 去掉括号内容（如"野餐垫/折叠地垫（3-5英尺）" -> "野餐垫/折叠地垫"）
      kw = kw.replace(/（[^）]*）/g, "").replace(/\([^)]*\)/g, "").trim();
      // 去掉地域词（1688 供应链不受地域限制）
      kw = kw.replace(/泰国|泰式|东南亚|跨境|海外|Thai\b/gi, "").trim();

    /* ---------------------------------------------------------- 初始化 */
    try {
      // 初始化历史记录：当前页 = 总览视图（不新增历史）
      try { history.replaceState({ view: "overview" }, "", location.href); } catch (e) { /* ignore */ }

      // 读取跳转参数：URL query 优先，localStorage 兜底（第一界面双通道传递）
      var currentSelection = null;
      try {
        var qs = new URLSearchParams(window.location.search);
        if (qs.get("level1") || qs.get("level2")) {
          currentSelection = {
            country: qs.get("country") || "泰国",
            level1: qs.get("level1") || "",
            level2: (qs.get("level2") || "").split(",").filter(Boolean)
          };
        }
      } catch (e) { /* ignore */ }
      if (!currentSelection) {
        try {
          var rawSel = localStorage.getItem("analysis-selection");
          if (rawSel) currentSelection = JSON.parse(rawSel);
        } catch (e) { /* ignore */ }
      }
      STATE.selection = currentSelection;

      periodReady.then(function () {

      // 数据周期：从 STATE.activePeriod 读取（页面加载时异步获取）
      var period = STATE.activePeriod || "2026-08";
      if (currentSelection && currentSelection.level2 && currentSelection.level2.length) {
        // 只分析第一个选中 L2（不跨 L2 合并，第二界面类目筛选器保留全部所选）
        var target = {
          country: String(currentSelection.country || "泰国").trim(),
          level1: String(currentSelection.level1 || "").trim(),
          level2: String(currentSelection.level2[0] || "").trim(),
          period: STATE.activePeriod || period,
          top_n: 20
        };
        // 类目筛选器：展示所选 L2（真实数据源对应）
        var cats = currentSelection.level2.map(function (l2) {
          return currentSelection.level1 + " > " + l2;
        });
        el.categorySelect.innerHTML = cats.map(function (c) {
          return '<option>' + esc(c) + '</option>';
        }).join("");

        // 跳转进入时：展示当前分析范围（不改变视觉结构，仅更新文案）
        var scope = document.querySelector("#overview-title + p");
        if (scope) {
          var l2txt = (currentSelection.level2 || []).join("、");
          scope.textContent = "基于 " + period + " 泰国站关键词数据，综合需求 / 转化 / 竞争三维评分｜" +
            (currentSelection.country || "泰国") + " / " + currentSelection.level1 +
            (l2txt ? " / " + l2txt : "");
        }

        // Loading 状态
        el.oppGrid.innerHTML = '<div class="col-span-full rounded-xl border border-slate-200 bg-white p-10 text-center text-slate-400">' +
          '正在分析「' + esc(target.level1) + ' > ' + esc(target.level2) + '」真实数据…</div>';
        el.listBody.innerHTML = '<tr><td colspan="9" class="px-4 py-10 text-center text-slate-400">正在分析…</td></tr>';
        el.listCount.textContent = "正在分析…";

        fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(target)
        }).then(function (resp) { return resp.json(); }).then(function (data) {
          if (!data || data.status === "empty") {
            var msg = (data && data.message) || "该类目样本不足，暂不建议分析";
            el.oppGrid.innerHTML = '<div class="col-span-full rounded-xl border border-amber-200 bg-amber-50 p-10 text-center">' +
              '<div class="text-3xl mb-3">📊</div>' +
              '<div class="text-base font-semibold text-amber-800 mb-2">该类目样本量过少</div>' +
              '<div class="text-sm text-amber-700">' + esc(msg) + '</div>' +
            '</div>';
            el.listBody.innerHTML = '<tr><td colspan="9" class="px-4 py-10 text-center text-amber-600">' + esc(msg) + '</td></tr>';
            el.listCount.textContent = "样本不足";
            el.statGrid.innerHTML = "";
            return;
          }
          if (data.status !== "success") {
            var msg2 = (data && data.message) || "分析失败";
            throw new Error(msg2);
          }
          STATE.cohortSize = (data.summary && data.summary.cohort_size) || 0;
          STATE.summary = data.summary || {};
          STATE.opportunities = (data.opportunities || []).map(normOpp);
          if (STATE.selection && STATE.selection.level1) {
            var cat = STATE.selection.level1 + " > " + ((STATE.selection.level2 && STATE.selection.level2[0]) || "");
            track("category_selected", { category: cat });
          }
          renderOverview();
          renderList();
          updateSortArrows();
          showView("overview");
          track("opportunity_view", { category: STATE.selection ? STATE.selection.level1 : null });
          if (STATE.opportunities.length === 0) {
            showToast("该类目清洗/过滤后无可用机会");
          }
        }).catch(function (err) {
          el.oppGrid.innerHTML = '<div class="col-span-full rounded-xl border border-red-200 bg-red-50 p-10 text-center text-red-600">' +
            '⚠️ ' + esc(err.message || "分析请求失败") + '</div>';
          el.listBody.innerHTML = '<tr><td colspan="9" class="px-4 py-10 text-center text-red-400">' + esc(err.message || "分析请求失败") + '</td></tr>';
          el.listCount.textContent = "分析失败";
          el.statGrid.innerHTML = "";
        });
      } else {
        // 无跳转参数：显示引导
        el.oppGrid.innerHTML = '<div class="col-span-full rounded-xl border border-slate-200 bg-white p-10 text-center text-slate-400">' +
          '请从第一界面选择国家 / 一级类目 / 二级类目后进入分析。</div>';
        renderList();
        updateSortArrows();
        showView("overview");
      }
      });
    } catch (err) {
      // 交互初始化失败时，保留静态骨架，仍可阅读
      document.body.classList.add("bg-slate-50");
    }
    setTimeout(restoreFindTaskFromStorage, 500);
  })();
  </script>

  <!-- 找货模态层 -->
  <div id="finder-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 no-print">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-hidden flex flex-col">
      <div id="finder-body" class="overflow-y-auto p-6 sm:p-8"></div>
    </div>
  </div>

</body>
</html>
