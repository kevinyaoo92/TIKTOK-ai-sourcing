<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>POC-3A 详情页测试</title>
<style>
body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 20px; color: #222; }
h1 { font-size: 20px; }
input { font-size: 14px; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; width: 320px; }
button { font-size: 15px; padding: 10px 22px; cursor: pointer; border-radius: 6px; border: 1px solid #0066cc; background: #0066cc; color: #fff; margin-left: 8px; }
button:hover { background: #0055aa; }
.status { margin-top: 20px; padding: 16px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; }
.row { margin: 6px 0; font-size: 14px; }
.label { color: #888; display: inline-block; width: 130px; }
.status-pending { color: #888; }
.status-running { color: #0066cc; }
.status-success { color: #009900; font-weight: bold; }
.status-failed { color: #cc0000; font-weight: bold; }
pre { background: #f5f5f5; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>
<h1>POC-3A 详情页读取测试</h1>
<p>输入 1688 offer_id（纯数字），创建 detail 任务。</p>
<input id="inp-offer" placeholder="例如 835987122744" value="">
<button id="btn-detail">创建详情任务</button>

<div class="status">
  <div class="row"><span class="label">状态：</span><span id="st-status" class="status-pending">未开始</span></div>
  <div class="row"><span class="label">task_id：</span><span id="st-task-id">—</span></div>
  <div class="row"><span class="label">offer_id：</span><span id="st-offer">—</span></div>
  <div class="row"><span class="label">完成时间：</span><span id="st-completed">—</span></div>
</div>

<div class="status" style="margin-top:12px">
  <div class="label">返回 payload：</div>
  <pre id="v-payload">—</pre>
</div>

<script>
var currentTaskId = null;
var pollTimer = null;

function setStatus(text, cls) {
  var el = document.getElementById("st-status");
  el.textContent = text;
  el.className = cls;
}

function renderTask(t) {
  document.getElementById("st-task-id").textContent = t.task_id || "—";
  document.getElementById("st-offer").textContent = t.offer_id || "—";
  document.getElementById("st-completed").textContent = t.completed_at || "—";
  var s = t.task_status;
  if (s === "pending") setStatus("待执行", "status-pending");
  else if (s === "running") setStatus("执行中", "status-running");
  else if (s === "success") setStatus("成功", "status-success");
  else if (s === "failed") setStatus("失败", "status-failed");
  if (t.payload) {
    document.getElementById("v-payload").textContent = JSON.stringify(t.payload, null, 2);
  }
}

function pollStatus() {
  if (!currentTaskId) return;
  fetch("/api/poc_task/status?task_id=" + encodeURIComponent(currentTaskId))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d.status === "ok" && d.task) {
        renderTask(d.task);
        if (d.task.task_status === "success" || d.task.task_status === "failed") {
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }
      }
    }).catch(function(){});
}

document.getElementById("btn-detail").addEventListener("click", function() {
  var oid = (document.getElementById("inp-offer").value || "").trim();
  if (!oid) { alert("请输入 offer_id"); return; }
  fetch("/api/poc_task/create", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({task_type: "detail", offer_id: oid})
  }).then(function(r){ return r.json(); })
    .then(function(d){
      if (d.status !== "ok") { alert("创建失败: " + JSON.stringify(d)); return; }
      currentTaskId = d.task_id;
      setStatus("待执行", "status-pending");
      document.getElementById("st-task-id").textContent = d.task_id;
      document.getElementById("st-offer").textContent = oid;
      document.getElementById("st-completed").textContent = "—";
      document.getElementById("v-payload").textContent = "—";
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(pollStatus, 1000);
      pollStatus();
    }).catch(function(e){ alert("请求失败: " + e.message); });
});
</script>
</body>
</html>
